services:
  gridwise-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridwise-api:latest
    container_name: gridwise-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
      GROQ_BASE_URL: "https://api.groq.com/openai/v1"
      LLM_MODEL: "openai/gpt-oss-120b"
      LLM_TEMPERATURE: "0"
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-low}"
      LLM_TIMEOUT_SECONDS: "10"
      LLM_MAX_RETRIES: "2"
      LLM_MOCK: "${LLM_MOCK:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped